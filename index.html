<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pengeluaran Bulanan</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7480;--ac:#0f766e;--bd:#e3e6ea;--rd:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2026;--tx:#eef1f4;--mu:#9aa4b0;--ac:#2dd4bf;--bd:#2a313a;--rd:#ff7b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b2026;--tx:#eef1f4;--mu:#9aa4b0;--ac:#2dd4bf;--bd:#2a313a;--rd:#ff7b6b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
main{max-width:480px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h1{font-size:20px;margin:4px 0 12px}
.row{display:flex;gap:8px;align-items:center}
input,select,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%}
button{background:var(--ac);color:#fff;border:0;font-weight:600;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#08201d}}
.total{font-size:28px;font-weight:700}
.mu{color:var(--mu);font-size:13px}
.bar{height:8px;border-radius:4px;background:var(--bd);overflow:hidden;margin:4px 0 10px}
.bar>i{display:block;height:100%;background:var(--ac)}
.item{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--bd)}
.item:first-child{border-top:0}
.x{width:auto;background:none;color:var(--rd);padding:0 6px;font-size:18px}
.sm{width:auto;flex:0 0 auto;padding:8px 14px}
.donut{width:130px;height:130px;border-radius:50%;margin:0 auto 12px;position:relative}.donut::after{content:"";position:absolute;inset:26px;border-radius:50%;background:var(--card)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.trend{display:flex;align-items:flex-end;gap:6px;margin-top:8px}.trend div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.trend i{display:block;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px;margin-bottom:4px}
.ghost{background:none;color:var(--ac);border:1px solid var(--ac)}
</style>
</head>
<body>
<main>
<h1>💸 Pengeluaran Bulanan</h1>
<div class="mu" id="mode" style="margin:-6px 0 12px">Mode pribadi: data tersimpan di perangkat ini.</div>
<div class="card">
  <div class="row"><button class="sm" id="prev">‹</button><input type="month" id="bulan"><button class="sm" id="next">›</button></div>
  <div class="mu" style="margin-top:12px">Total bulan ini</div>
  <div class="total" id="total">Rp0</div>
  <div class="row" style="margin-top:8px"><input id="budget" type="number" inputmode="numeric" placeholder="Anggaran bulanan (opsional)"></div>
  <div class="bar"><i id="pb" style="width:0"></i></div>
  <div class="mu" id="sisa"></div>
</div>
<div class="card">
  <div class="row" style="margin-bottom:8px"><input type="date" id="tgl"></div>
  <div class="row" style="margin-bottom:8px"><input id="nama" placeholder="Keterangan (mis. makan siang)"></div>
  <div class="row" style="margin-bottom:8px">
    <input id="jumlah" type="number" inputmode="numeric" placeholder="Jumlah (Rp)">
    <select id="kat"></select>
  </div>
  <button id="add">Tambah pengeluaran</button>
  <div class="row" style="margin-top:8px"><input id="newkat" placeholder="Kategori baru"><button class="sm ghost" id="addkat">+ Kategori</button></div>
</div>
<div class="card"><b>Kelola kategori</b><div id="catlist" style="margin-top:8px"></div><div class="mu" id="catmsg"></div></div>
<div class="card"><b>Per kategori</b><div class="donut" id="donut" style="margin-top:12px"></div><div id="kats"></div></div>
<div class="card"><b>Tren 6 bulan terakhir</b><div class="trend" id="trend"></div></div>
<div class="card"><button id="csv" class="ghost">⬇ Ekspor CSV (bulan ini)</button><div class="mu" id="csvmsg" style="margin-top:6px"></div></div>
<div class="card"><b>Riwayat</b><div id="list" style="margin-top:6px"></div></div>
</main>
<script>
var $=function(i){return document.getElementById(i)};
var data={items:[],budget:{}};
try{var s=localStorage.getItem("pengeluaran");if(s)data=JSON.parse(s)}catch(e){}
if(!data.cats||!data.cats.length)data.cats=["Makan","Transport","Tagihan","Belanja","Hiburan","Lainnya"];
var COL=["#0f766e","#2563eb","#d97706","#db2777","#7c3aed","#65a30d","#dc2626","#0891b2"];
function colorOf(k){return COL[Math.max(0,data.cats.indexOf(k))%COL.length]}
var local=JSON.parse(JSON.stringify(data)),DB=null,synced={},offered=false;
function fail(){$("mode").textContent="Gagal menyimpan ke data bersama. Mungkin kamu hanya punya akses lihat."}
function save(){
  if(!DB){try{localStorage.setItem("pengeluaran",JSON.stringify(data))}catch(e){}return}
  try{
    DB.doc("settings/main").set({cats:data.cats,budget:data.budget}).catch(fail);
    var cur={};
    data.items.forEach(function(x){var s=JSON.stringify(x);cur[x.id]=s;if(synced[x.id]!==s)DB.doc("expenses/"+x.id).set(x).catch(fail)});
    Object.keys(synced).forEach(function(id){if(!(id in cur))DB.doc("expenses/"+id).delete().catch(fail)});
    synced=cur;
  }catch(e){fail()}
}
var rp=function(n){return "Rp"+Math.round(n).toLocaleString("id-ID")};
var now=new Date();
$("bulan").value=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
function shift(d){var p=$("bulan").value.split("-");var dt=new Date(+p[0],+p[1]-1+d,1);
$("bulan").value=dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0");render()}
function esc(t){return t.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function render(){
  var b=$("bulan").value;
  var its=data.items.filter(function(x){return x.tgl.slice(0,7)===b}).sort(function(a,c){return c.tgl<a.tgl?-1:1});
  var tot=its.reduce(function(a,x){return a+x.jml},0);
  $("total").textContent=rp(tot);
  var tv=$("tgl").value;if(tv.slice(0,7)!==b){var td=today();$("tgl").value=td.slice(0,7)===b?td:b+"-01"}
  var bg=data.budget[b]||0;$("budget").value=bg||"";
  $("pb").style.width=bg?Math.min(100,tot/bg*100)+"%":"0";
  $("pb").style.background=bg&&tot>bg?"var(--rd)":"var(--ac)";
  $("sisa").textContent=bg?(tot>bg?"Melebihi anggaran "+rp(tot-bg):"Sisa anggaran "+rp(bg-tot)):"";
  var by={};its.forEach(function(x){by[x.kat]=(by[x.kat]||0)+x.jml});
  var ks=Object.keys(by).sort(function(a,c){return by[c]-by[a]});var acc=0;
  $("donut").style.background=ks.length?"conic-gradient("+ks.map(function(k){var s=acc/tot*100;acc+=by[k];return colorOf(k)+" "+s+"% "+(acc/tot*100)+"%"}).join(",")+")":"var(--bd)";
  $("kats").innerHTML=ks.map(function(k){
    return '<div class="row" style="justify-content:space-between"><span><i class="dot" style="background:'+colorOf(k)+'"></i>'+esc(k)+' <span class="mu">'+Math.round(by[k]/tot*100)+'%</span></span><span>'+rp(by[k])+'</span></div><div class="bar"><i style="width:'+(by[k]/tot*100)+'%;background:'+colorOf(k)+'"></i></div>'}).join("")||'<div class="mu">Belum ada data.</div>';
  renderTrend(b);
  var tt={},last="";its.forEach(function(x){tt[x.tgl]=(tt[x.tgl]||0)+x.jml});
  $("list").innerHTML=its.map(function(x){var h="";
    if(x.tgl!==last){last=x.tgl;h='<div class="row" style="justify-content:space-between;margin-top:10px"><b>'+fmtD(x.tgl)+'</b><span class="mu">'+rp(tt[x.tgl])+'</span></div>'}
    return h+'<div class="item"><div><div>'+esc(x.nama)+'</div><div class="mu">'+esc(x.kat)+byTxt(x)+'</div></div><div class="row"><b>'+rp(x.jml)+'</b><button class="x" data-id="'+x.id+'">×</button></div></div>'}).join("")||'<div class="mu">Belum ada pengeluaran.</div>';
  resolveNames(its);
}
function renderCats(){var cur=$("kat").value;$("kat").innerHTML=data.cats.map(function(c){return '<option>'+esc(c)+'</option>'}).join("");if(data.cats.indexOf(cur)>-1)$("kat").value=cur;
  $("catlist").innerHTML=data.cats.map(function(c,i){return '<div class="row" style="margin-bottom:6px"><i class="dot" style="background:'+colorOf(c)+';flex:0 0 10px"></i><input value="'+esc(c).replace(/"/g,"&quot;")+'"><button class="sm ghost" data-ren="'+i+'">Simpan</button><button class="x" data-del="'+i+'">×</button></div>'}).join("")}
var pend=-1;
function msg(t){$("catmsg").textContent=t}
$("catlist").onclick=function(e){var t=e.target,r=t.getAttribute("data-ren"),d=t.getAttribute("data-del");
  if(r!==null){var i=+r,old=data.cats[i],nn=t.parentNode.querySelector("input").value.trim();
    if(!nn||nn===old)return;
    data.items.forEach(function(x){if(x.kat===old)x.kat=nn});
    var j=data.cats.indexOf(nn);
    if(j>-1&&j!==i)data.cats.splice(i,1);else data.cats[i]=nn;
    pend=-1;msg("Kategori diubah.")}
  else if(d!==null){var k=+d,old2=data.cats[k];
    if(pend!==k){pend=k;msg("Ketuk × sekali lagi untuk menghapus "+old2+". Pengeluarannya dipindah ke Lainnya.");return}
    data.cats.splice(k,1);
    if(data.items.some(function(x){return x.kat===old2})){if(data.cats.indexOf("Lainnya")<0)data.cats.push("Lainnya");data.items.forEach(function(x){if(x.kat===old2)x.kat="Lainnya"})}
    if(!data.cats.length)data.cats.push("Lainnya");
    pend=-1;msg("Kategori dihapus.")}
  else return;
  save();renderCats();render()};
function renderTrend(b){var p=b.split("-"),vals=[];
  for(var i=5;i>=0;i--){var d=new Date(+p[0],+p[1]-1-i,1);var m=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    var t=data.items.filter(function(x){return x.tgl.slice(0,7)===m}).reduce(function(a,x){return a+x.jml},0);
    vals.push({m:d.toLocaleString("id-ID",{month:"short"}),t:t})}
  var mx=Math.max.apply(null,vals.map(function(v){return v.t}))||1;
  $("trend").innerHTML=vals.map(function(v){return '<div><i style="height:'+(v.t/mx*70)+'px"></i>'+v.m+'</div>'}).join("")}
$("addkat").onclick=function(){var n=$("newkat").value.trim();if(!n)return;if(data.cats.indexOf(n)<0)data.cats.push(n);$("newkat").value="";save();renderCats();$("kat").value=n;render()};
var DL=null;
if(window.claude&&claude.use){claude.use("downloads").then(function(d){DL=d;if(!d)$("csv").parentNode.style.display="none"}).catch(function(){})}else{$("csv").parentNode.style.display="none"}
function q(s){return '"'+String(s).replace(/"/g,'""')+'"'}
$("csv").onclick=function(){
  if(!DL){$("csvmsg").textContent="Ekspor tidak tersedia di tampilan ini.";return}
  var b=$("bulan").value;
  var its=data.items.filter(function(x){return x.tgl.slice(0,7)===b}).sort(function(a,c){return a.tgl<c.tgl?-1:1});
  if(!its.length){$("csvmsg").textContent="Tidak ada data bulan ini.";return}
  var rows=["Tanggal,Keterangan,Kategori,Jumlah,Dicatat oleh"].concat(its.map(function(x){return [x.tgl,q(x.nama),q(x.kat),x.jml,q(nameOf(x))].join(",")}));
  DL.save({filename:"pengeluaran-"+b+".csv",data:"\uFEFF"+rows.join("\r\n")}).then(function(){$("csvmsg").textContent="Tersimpan."}).catch(function(e){$("csvmsg").textContent=e&&e.code==="declined"?"Dibatalkan.":"Gagal menyimpan."});
};
renderCats();
var SHARED="Mode bersama: data terlihat oleh semua orang yang memegang tautan ini.";
function offer(){var n=local.items.length;
  $("mode").innerHTML='Ada '+n+' data pribadi di perangkat ini. <button class="sm ghost" id="imp" style="padding:4px 10px">Impor ke data bersama</button>';
  $("imp").onclick=function(){local.items.forEach(function(x){DB.doc("expenses/"+x.id).set(x).catch(fail)});$("mode").textContent=SHARED}}
if(window.claude&&claude.use){claude.use("db").then(function(d){
  if(!d)return;DB=d;$("mode").textContent=SHARED;
  DB.collection("expenses").onSnapshot(function(s){
    var cur={};data.items=s.docs.map(function(x){var v=x.data();cur[v.id]=JSON.stringify(v);return v});
    synced=cur;
    if(s.empty&&local.items.length&&!offered){offered=true;offer()}
    render()},fail);
  DB.doc("settings/main").onSnapshot(function(s){var v=s.data();
    if(v){if(v.cats&&v.cats.length)data.cats=v.cats;data.budget=v.budget||{}}
    renderCats();render()},fail);
}).catch(function(){})}
var USER=null,ME=null,names={},asked={};
function nameOf(x){if(!x.by)return "";if(x.by===ME)return "Kamu";return names[x.by]||""}
function byTxt(x){var n=nameOf(x);return n?' · oleh '+esc(n):''}
function resolveNames(its){if(!USER)return;
  var ids=[];its.forEach(function(x){if(x.by&&x.by!==ME&&!(x.by in names)&&!asked[x.by]){asked[x.by]=1;ids.push(x.by)}});
  if(!ids.length)return;
  Promise.resolve(USER.profiles(ids)).then(function(ps){ids.forEach(function(id){names[id]=(ps&&ps[id]&&ps[id].name)||"Anggota"});render()}).catch(function(){ids.forEach(function(id){names[id]="Anggota"});render()})}
if(window.claude&&claude.use){claude.use("user").then(function(u){if(!u)return;USER=u;return Promise.resolve(u.id()).then(function(id){ME=id;render()})}).catch(function(){})}
function today(){var t=new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")}
function fmtD(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("id-ID",{weekday:"short",day:"numeric",month:"short"})}
$("add").onclick=function(){
  var j=parseFloat($("jumlah").value);if(!j||j<=0){$("jumlah").focus();return}
  var tg=$("tgl").value||today();
  data.items.push({id:Date.now(),nama:$("nama").value.trim()||$("kat").value,jml:j,kat:$("kat").value,tgl:tg,by:ME});
  $("nama").value="";$("jumlah").value="";$("bulan").value=tg.slice(0,7);save();render();
};
$("list").onclick=function(e){var id=e.target.getAttribute("data-id");if(!id)return;
  data.items=data.items.filter(function(x){return String(x.id)!==id});save();render()};
$("budget").onchange=function(){data.budget[$("bulan").value]=parseFloat($("budget").value)||0;save();render()};
$("bulan").onchange=render;$("prev").onclick=function(){shift(-1)};$("next").onclick=function(){shift(1)};
render();
</script>
</body>
</html>
